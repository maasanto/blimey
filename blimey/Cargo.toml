[package]
name = "blimey"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
midir = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
# libudev only adds USB details to port listings on Linux; macOS uses IOKit regardless.
serialport = { version = "4.10", default-features = false }
blimey-engine = { path = "../engine" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree through midir: runs the loop CoreMIDI updates its port list on.
core-foundation = "0.10"

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.29"
