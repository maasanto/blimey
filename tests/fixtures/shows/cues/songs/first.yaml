program: 1
bpm: 120
safe_look:
  both: { color: white, dimmer: 20% }
cues:
  36:
    name: red-fade
    type: scene
    fade_in: 1s
    release: 500ms
    values:
      dimmer-par: { color: red }
  37:
    name: blue-snap
    type: scene
    values:
      dimmer-par: { color: blue }
  38:
    name: both-green-half
    type: scene
    values:
      both: { color: green, dimmer: 50% }
  39:
    name: four-bar-swell
    type: swell
    target: { dimmer-par: { color: white } }
    duration: 4 bars
    release: 1 beat
  42:
    name: verse-pulse
    type: pattern
    length: 1 bar
    target: { both: dimmer }
    release: 1 beat
    hits:
      - { at: 1,   shape: ramp-up, length: 0.5 beats, level: 100% }
      - { at: 2,   shape: sine,    length: 0.5 beats, level: 80% }
      - { at: 3.5, shape: ramp-up, length: 0.5 beats, level: 100% }
