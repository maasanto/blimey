name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # midir links against ALSA on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Playwright against the real engine, with no DMX device: frames go only to the stream.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # After the UI build, so the binary embeds it.
      - run: cargo build
        working-directory: .
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
