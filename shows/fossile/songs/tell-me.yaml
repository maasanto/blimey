# Example song from the plan (§6). Program and cue notes are placeholders until the Reaper
# session is reprogrammed: Program Change 3 on channel 2 selects it, channel-2 notes fire cues.
program: 3
bpm: 92
safe_look:
  all-wash: { color: warm-white, dimmer: 30% }
cues:
  36:
    name: verse-blue
    type: scene
    fade_in: 2s
    release: 1s
    values:
      all-wash: { color: deep-blue, dimmer: 60% }
  37:
    name: chorus-amber
    type: scene
    fade_in: 500ms
    release: 500ms
    values:
      all-wash: { color: amber }
      outer-wash: { color: magenta }
  38:
    name: blackout
    type: scene
    fade_in: 1s
    values:
      all-wash: { dimmer: 0% }
  39:
    name: chorus-swell
    type: swell
    target:
      all-wash: { dimmer: 100% }
    duration: 4 bars
    curve: ease-in
    release: 500ms
  40:
    name: bridge-chase
    type: pixel
    effect: chase
    params: { color: amber, width: 0.2, speed: 1 bar, direction: left-to-right }
    seed: 7
  42:
    name: verse-pulse
    type: pattern
    length: 1 bar
    target: { all-wash: dimmer }
    hits:
      - { at: 1, shape: ramp-up, length: 0.5 beats, level: 100% }
      - { at: 2, shape: sine, length: 0.5 beats, level: 80% }
      - { at: 3.5, shape: ramp-up, length: 0.5 beats, level: 100% }
