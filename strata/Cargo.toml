[package]
name = "strata"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
midir = "0.11"
# libudev only adds USB details to port listings on Linux; macOS uses IOKit regardless.
serialport = { version = "4.10", default-features = false }
strata-engine = { path = "../engine" }
