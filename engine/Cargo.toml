[package]
name = "blimey-engine"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
jsonschema = { version = "0.61.2", default-features = false }
midly = "0.5"
serde = { version = "1", features = ["derive"] }
# preserve_order: a look's entries apply in file order, so show files keep their key order as JSON.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
